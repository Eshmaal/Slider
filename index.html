<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Image Slider</title>
    <link rel="stylesheet" href="slider.css">
    <!-- Updated Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="slider" id="slider">
            <img src="https://images.unsplash.com/photo-1793642506964-1e9f42014256?w=600&auto=format&fit=crop&q=80" alt="Slide 1">
            <img src="https://images.unsplash.com/photo-1793631604583-a416fbe3e432?w=600&auto=format&fit=crop&q=80" alt="Slide 2">
            <img src="https://images.unsplash.com/photo-1792443074929-4471c41c7a86?w=600&auto=format&fit=crop&q=80" alt="Slide 3">
            <img src="https://images.unsplash.com/photo-1793774263030-609d2c421a4a?w=600&auto=format&fit=crop&q=80" alt="Slide 4">
        </div>
        
        <button id="prev-btn" class="btn" aria-label="Previous Slide">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button id="next-btn" class="btn" aria-label="Next Slide">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <!-- Pagination Dots -->
        <div class="dots-container" id="dots-container"></div>
    </div>

    <script src="slider.js"></script>
</body>
</html>
